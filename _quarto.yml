project:
  type: website
  output-dir: docs

website:
  title: "MedEdAI"
  favicon: images/MedEdAILogo2.png
  navbar:
    left:
      - about.qmd
    right:
      - href: https://www.directorsofclinicalskillseducation.org/
        text: '<i class="bi bi-hospital"></i>'
        aria-label: "DOCS Website"
  sidebar:
    style: "docked"
    search: true
    contents:
    - index.qmd
    - profdev.qmd
    - learning.qmd
    - mededref.qmd

format:
  html:
    theme:
      - morph
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    css: styles.css
    toc: true
    link-external-newwindow: true
    link-external-icon: true

editor: visual

date: today
